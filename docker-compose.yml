services:
  postgres:
    image: postgres:16
    container_name: physio-desk
    restart: unless-stopped
    environment:
      POSTGRES_USER: physio
      POSTGRES_PASSWORD: physio
      POSTGRES_DB: physio_desk
    ports:
      - "5432:5432"
    volumes:
      - physio-desk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physio -d physio_desk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./physiodesk-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://physio:physio@postgres:5432/physio_desk
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET_KEY: change-this-development-secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./physiodesk-frontend
    environment:
      BACKEND_API_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  physio-desk-data:
